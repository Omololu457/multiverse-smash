<!doctype html><meta charset=utf-8><title>Homelander SFX audition</title><style>body{font-family:system-ui;background:#111;color:#eee;padding:16px}h2{color:#e44;border-bottom:1px solid #333}.g{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:6px}.c{background:#1a1a1a;padding:6px 10px;border-radius:6px;font-size:.8em;display:flex;gap:8px;align-items:center}audio{height:28px}</style><h1>Homelander voice lines and SFX</h1><div id=a></div><script>fetch('manifest.json').then(r=>r.json()).then(m=>{for(const[k,v]of Object.entries(m.folders)){const d=document.createElement('div');d.innerHTML='<h2>'+k+' ('+v.length+')</h2><div class=g></div>';for(const c of v){const e=document.createElement('div');e.className='c';e.innerHTML='<audio controls preload=none src="'+c.file+'"></audio><span>'+c.file.split('/').pop()+' · '+c.length_s+'s</span>';d.lastChild.appendChild(e)}document.getElementById('a').appendChild(d)}})</script>
