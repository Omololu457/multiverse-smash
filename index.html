            -webkit-tap-highlight-color: transparent;

        html,
        body {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: var(--bg);
            font-family: Arial, Helvetica, sans-serif;
            touch-action: none;
        }

        body {
            display: flex;
            justify-content: center;
            align-items: center;
        }

        canvas {
            display: block;
            width: 100vw;
            height: 100vh;
            background: radial-gradient(circle at center, #102c58 0%, #061225 100%);
            image-rendering: optimizeSpeed;
            image-rendering: pixelated;
        }

        /* Fullscreen toggle — subtle themed overlay button (top-left, above canvas) */
        #fullscreenBtn {
            position: fixed;
            top: 12px;
            left: 12px;
            z-index: 10000;
            width: 42px;
            height: 42px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 22px;
            line-height: 1;
            color: #cfe3ff;
            background: rgba(10, 19, 34, 0.55);
            border: 1px solid rgba(120, 170, 255, 0.35);
            border-radius: 8px;
            cursor: pointer;
            opacity: 0.55;
            transition: background 0.15s ease, opacity 0.15s ease, transform 0.1s ease;
            -webkit-backdrop-filter: blur(2px);
            backdrop-filter: blur(2px);
        }

        #fullscreenBtn:hover {
            background: rgba(24, 46, 88, 0.9);
            opacity: 1;
        }

        #fullscreenBtn:active {
            transform: scale(0.94);
        }

        /* Loading Screen */
        #loading {
            position: fixed;
            inset: 0;
            background: #061225;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            gap: 18px;
            color: white;
            font-size: 1.4rem;
            letter-spacing: 2px;
            z-index: 9999;
            transition: opacity .5s ease;
        }

        #loadBar {
            width: min(60vw, 420px);
            height: 10px;
            border-radius: 6px;
            background: rgba(255, 255, 255, 0.12);
            overflow: hidden;
        }

        #loadFill {
            height: 100%;
            width: 0%;
            border-radius: 6px;
            background: linear-gradient(90deg, #3b82f6, #22d3ee);
            transition: width .18s ease;
        }

        #loadPct {
            font-size: .9rem;
            letter-spacing: 1px;
            opacity: .7;
        }

        /* Rotating lore fragment (Part 1 #1) — reuses endings.js epilogue text. Each fragment is a full
           sentence, so a fast load that hides the screen never cuts one mid-thought. */
        #loadFlavor {
            max-width: min(72vw, 560px);
            min-height: 3.2em;
            margin-top: 6px;
            font-size: .92rem;
            line-height: 1.5;
            letter-spacing: .3px;
            font-style: italic;
            text-align: center;
            color: rgba(226, 232, 245, 0.72);
            opacity: 0;
            transition: opacity .5s ease;
        }
        #loadFlavor.show { opacity: 1; }

        #loading.hidden {

             opacity: 0;
            pointer-events: none;
        }

        noscript {
            color: white;
            position: absolute;
            inset: 0;

             display: grid;
            place-items: center;
            font-size: 1.2rem;
            background: #061225;
        }

    <script type="module">
        // Determinate loading bar. window.__setLoadProgress(done,total) is the real, count-driven hook:
        // game.js's match-start preloader (Stage 10) calls it once per decoded sheet, so if the bar is
        // ever visible during a preload it reflects actual decode progress. The page itself has no
        // per-asset decode phase at first paint, so before window 'load' we drive a COARSE-but-real
        // signal off document.readyState rather than faking a spinner.
        const fill = document.getElementById("loadFill");
        const pct  = document.getElementById("loadPct");
        const setPct = frac => {
            const p = Math.max(0, Math.min(1, frac));
            if (fill) fill.style.width = (p * 100).toFixed(0) + "%";
            if (pct)  pct.textContent  = (p * 100).toFixed(0) + "%";
        };
        window.__setLoadProgress = (done, total) => setPct(total > 0 ? done / total : 0);

        // Coarse initial-load progression: parsing done → interactive, everything (modules, first images)
        // → complete. Real decode-counted progress takes over via __setLoadProgress at match start.
        setPct(document.readyState === "complete" ? 1 : document.readyState === "interactive" ? 0.6 : 0.15);
        document.addEventListener("readystatechange", () => {
            setPct(document.readyState === "complete" ? 1 : document.readyState === "interactive" ? 0.6 : 0.15);
        });

        window.addEventListener("load", () => {
            setPct(1);
            document.getElementById("loading").classList.add("hidden");
            stopFlavor();
        });

        // ROTATING LORE FRAGMENTS (Part 1 #1). Pure wiring: reuse the already-written arcade epilogue
        // text from endings.js — no new copy. Each fragment is one complete sentence, so hiding the
        // loader on 'load' can never cut a fragment mid-sentence. Import is dynamic + best-effort so a
        // failure here can never block boot.
        let flavorTimer = null;
        const stopFlavor = () => { if (flavorTimer) { clearInterval(flavorTimer); flavorTimer = null; } };
        (async () => {
            try {
                const el = document.getElementById("loadFlavor");
                if (!el) return;
                const { ENDINGS } = await import("./endings.js");
                // Flatten every epilogue slide's text into a pool; keep full sentences only.
                const pool = [];
                for (const slides of Object.values(ENDINGS || {})) {
                    if (!Array.isArray(slides)) continue;
                    for (const s of slides) { const t = (s && s.text || "").trim(); if (t.length > 8) pool.push(t); }
                }
                if (!pool.length) return;
                // Shuffle (Fisher–Yates) so the order differs each boot.
                for (let i = pool.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [pool[i], pool[j]] = [pool[j], pool[i]]; }
                let idx = 0;
                const show = () => {
                    el.classList.remove("show");
                    // brief fade-out, then swap text + fade-in
                    setTimeout(() => { el.textContent = pool[idx % pool.length]; el.classList.add("show"); idx++; }, 260);
                };
                show();
                flavorTimer = setInterval(show, 4200);
            } catch (_) { /* boot must never depend on flavor text */ }
        })();
    </script>
