            height: 100vh;

            image-rendering: optimizeSpeed;
            image-rendering: pixelated;
        }

        /* Loading Screen */
        #loading {
            position: fixed;
            inset: 0;
            background: #061225;
            display: flex;
            justify-content: center;
            align-items: center;
            color: white;
            font-size: 1.4rem;
            letter-spacing: 2px;
            z-index: 9999;
            transition: opacity .5s ease;
        }

        #loading.hidden {
            opacity: 0;
            pointer-events: none;
        }

        noscript {
            color: white;
            position: absolute;
            inset: 0;
            display: grid;
            place-items: center;
            font-size: 1.2rem;
            background: #061225;
        }
    </style>
</head>
